name: Release APK + Provisioning QR

# Builds a signed release APK, verifies the signing certificate matches the release keystore,
# publishes the APK at a STABLE latest-release URL, and produces provisioning-qr.png as an
# artifact. Runs on a version tag (v*) or manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of your release.keystore (see PROVISIONING.md)
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias inside the keystore
#   RELEASE_KEY_PASSWORD      key password
#
# This build installs NO other APK, so there is no POS URL/checksum to configure.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   HOME_APPS   comma-separated home app packages  (default: com.android.chrome,com.android.settings)
#   WIFI_SSID   install-site SSID                   (default: "FLO Secure")
#   ADMIN_PIN   4-digit PIN override                (default: none → app uses 5913)
#   HIDE_STOCK_LAUNCHER  "true" to also hide the stock launcher package (default: off)
#   HIDE_TASKBAR  "true" to hide the Quickstep taskbar/recents provider so no taskbar shows
#               inside other apps on large screens (Recents button becomes inert; default: off)
#   NO_HIDE_OTHER_APPS     "true" to leave non-allowed apps visible (default: they are hidden)
#   ALLOW_APP_SUGGESTIONS  "true" to keep the taskbar's suggested apps (default: suggestions off)
# Optional secret:
#   WIFI_PASSWORD   install-site Wi-Fi password     (REQUIRED — build fails if unset)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      home_apps:
        description: "Home app packages, comma-separated (special cases only)"
        required: false
      wifi_ssid:
        description: "Install-site SSID (special cases only)"
        required: false
      wifi_password:
        description: "Install-site Wi-Fi password (special cases only)"
        required: false

permissions:
  contents: write   # needed to create/update the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. See PROVISIONING.md."
            exit 1
          fi
          # Tolerate stray whitespace/newlines from a copy-paste of the secret.
          echo "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if [ "${TAG}" = "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            NAME="0.0.0-manual-${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          # Injected into BuildConfig.WIFI_PASSWORD_DEFAULT; never committed to source.
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          cp "$APK" "${RUNNER_TEMP}/v3poslauncher-release.apk"
          echo "APK_PATH=${RUNNER_TEMP}/v3poslauncher-release.apk" >> "$GITHUB_ENV"

      - name: Compute signature checksum from the keystore
        id: keycksum
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Keytool needs the store password on stdin.
          CKSUM="$(keytool -exportcert -keystore "${RELEASE_KEYSTORE_PATH}" -alias "${RELEASE_KEY_ALIAS}" \
                    -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
                    | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=')"
          echo "checksum=${CKSUM}" >> "$GITHUB_OUTPUT"
          echo "Signature checksum (from keystore): ${CKSUM}"

      - name: Verify the APK is signed by that same certificate  # Acceptance criterion #7
        env:
          EXPECTED: ${{ steps.keycksum.outputs.checksum }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          # apksigner prints the signer cert SHA-256 as hex; convert to base64url(no pad) to compare.
          # Match the digest line regardless of apksigner's prefix format and take the last field.
          HEX="$("$APKSIGNER" verify --print-certs "${APK_PATH}" \
                  | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr -d '[:space:]')"
          if ! echo "${HEX}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::Could not parse the APK signer SHA-256 from apksigner output:"
            "$APKSIGNER" verify --print-certs "${APK_PATH}" || true
            exit 1
          fi
          echo "APK signer cert SHA-256 (hex): ${HEX}"
          APK_CKSUM="$(echo "${HEX}" | xxd -r -p | openssl base64 | tr '+/' '-_' | tr -d '=')"
          echo "APK signer checksum (base64url): ${APK_CKSUM}"
          echo "Expected  (from keystore)      : ${EXPECTED}"
          if [ "${APK_CKSUM}" != "${EXPECTED}" ]; then
            echo "::error::Signed APK certificate does NOT match the release keystore. QR would be invalid."
            exit 1
          fi
          echo "OK: signed APK matches the release keystore."

      - name: Resolve QR inputs
        id: qr
        env:
          IN_APPS: ${{ github.event.inputs.home_apps }}
          IN_SSID: ${{ github.event.inputs.wifi_ssid }}
          VAR_APPS: ${{ vars.HOME_APPS }}
          VAR_SSID: ${{ vars.WIFI_SSID }}
          # Where the device downloads the launcher APK from. Set the DOWNLOAD_URL repo
          # variable to your Vercel URL (e.g. https://flo-pos-setup.vercel.app/v3poslauncher-release.apk).
          # If unset, defaults to this repo's GitHub Release asset URL.
          VAR_DLURL: ${{ vars.DOWNLOAD_URL }}
        run: |
          REPO_LATEST="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          APPS="${IN_APPS:-${VAR_APPS:-com.android.chrome,com.android.settings}}"
          SSID="${IN_SSID:-${VAR_SSID:-FLO Secure}}"
          DL_URL="${VAR_DLURL:-${REPO_LATEST}/v3poslauncher-release.apk}"
          {
            echo "apps=${APPS}"
            echo "ssid=${SSID}"
            echo "dl_url=${DL_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate provisioning QR
        env:
          WIFI_PASSWORD: ${{ github.event.inputs.wifi_password || secrets.WIFI_PASSWORD }}
          ADMIN_PIN: ${{ vars.ADMIN_PIN }}
          HIDE_STOCK: ${{ vars.HIDE_STOCK_LAUNCHER }}
          HIDE_TASKBAR: ${{ vars.HIDE_TASKBAR }}
          NO_HIDE_OTHER_APPS: ${{ vars.NO_HIDE_OTHER_APPS }}
          ALLOW_APP_SUGGESTIONS: ${{ vars.ALLOW_APP_SUGGESTIONS }}
        run: |
          pip install -r ci/requirements.txt
          if [ -z "${WIFI_PASSWORD}" ]; then
            echo "::error::WIFI_PASSWORD secret is not set. Add it (Settings → Secrets → Actions)."
            exit 1
          fi
          WPW="${WIFI_PASSWORD}"
          python3 ci/make_qr.py \
            --download-url        "${{ steps.qr.outputs.dl_url }}" \
            --signature-checksum  "${{ steps.keycksum.outputs.checksum }}" \
            --home-apps           "${{ steps.qr.outputs.apps }}" \
            --wifi-ssid           "${{ steps.qr.outputs.ssid }}" \
            --wifi-password       "${WPW}" \
            ${ADMIN_PIN:+--admin-pin "${ADMIN_PIN}"} \
            $([ "${HIDE_STOCK}" = "true" ] && echo --hide-stock-launcher) \
            $([ "${HIDE_TASKBAR}" = "true" ] && echo --hide-taskbar) \
            $([ "${NO_HIDE_OTHER_APPS}" = "true" ] && echo --no-hide-other-apps) \
            $([ "${ALLOW_APP_SUGGESTIONS}" = "true" ] && echo --allow-app-suggestions) \
            --out provisioning-qr.png \
            --json-out provisioning.json

      - name: Upload QR + APK as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provisioning
          path: |
            provisioning-qr.png
            provisioning.json
            ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release (stable latest URL)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            provisioning-qr.png
          fail_on_unmatched_files: true

      # Vercel deploys vercel-site/ from the main branch, so committing the freshly built
      # APK + QR there publishes them at the stable URL the printed QRs point to.
      - name: Publish APK + QR to vercel-site/ on main (triggers Vercel deploy)
        if: github.ref_type == 'tag'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "${APK_PATH}" "${RUNNER_TEMP}/apk.tmp"
          cp provisioning-qr.png "${RUNNER_TEMP}/qr.tmp"
          git fetch origin main
          git checkout -B main origin/main
          cp "${RUNNER_TEMP}/apk.tmp" vercel-site/v3poslauncher-release.apk
          cp "${RUNNER_TEMP}/qr.tmp"  vercel-site/provisioning-qr.png
          git add vercel-site/v3poslauncher-release.apk vercel-site/provisioning-qr.png
          if git diff --cached --quiet; then
            echo "vercel-site/ already up to date."
          else
            git commit -m "vercel-site: publish launcher v${VERSION_NAME} + QR [skip ci]"
            git push origin main
            echo "Pushed to main — Vercel will redeploy https://flo-pos-setup.vercel.app within ~1 minute."
          fi
